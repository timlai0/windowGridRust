[package]
name = "wg-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows helpers shared by the WindowGridRust overlay and app: shared memory, logging, single instance"

[dependencies]
wg-core = { path = "../wg-core" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]
