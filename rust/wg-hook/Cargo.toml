[package]
name = "wg-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WindowGridRust in-context hook DLL (WindowGridRust64.dll / WindowGridRust32.dll)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wg-core = { path = "../wg-core", default-features = false }

[features]
# Test-only names for the mutex, window messages and shared-memory sections.
isolated = []
