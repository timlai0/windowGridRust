[package]
name = "wg-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WindowGrid app: settings UI, tray icon, installer and supervisor of the hook and overlay"
build = "build.rs"

[dependencies]
wg-core = { path = "../wg-core" }
wg-win = { path = "../wg-win" }
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1"
embed-resource = "3"

[features]
# Test-only mutex, window-message and shared-memory names; embeds the isolated components.
isolated = ["wg-core/isolated"]
