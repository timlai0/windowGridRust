[package]
name = "wg-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WindowGrid overlay: GPU-composited grid, selection and HUD, and the final window snap"

[dependencies]
wg-core = { path = "../wg-core" }
wg-win = { path = "../wg-win" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-numerics]
version = "0.3"

[features]
# Test-only mutex, window-message and shared-memory names (see rust/README.md).
isolated = ["wg-core/isolated"]
