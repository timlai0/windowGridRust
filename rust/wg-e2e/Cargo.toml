[package]
name = "wg-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Real-drag end-to-end tests: isolated hook + isolated overlay + a test window (run with WindowGrid closed)"

[dependencies]
wg-core = { path = "../wg-core" }
wg-overlay = { path = "../wg-overlay", features = ["isolated"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
